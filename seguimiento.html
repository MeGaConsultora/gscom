<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>GScom — Seguimiento de tu equipo</title>
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png">
<meta name="theme-color" content="#0b0c0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  body { background: var(--header); }
  .hero { color: #fff; text-align: center; padding: 1.6rem 16px 4.5rem; }
  .hero img { width: 84px; height: 84px; }
  .hero p { color: #9aa3af; font-size: .9rem; margin-top: .3rem; }
  .wrap { max-width: 560px; margin: -3.5rem auto 0; padding: 0 16px 2rem; }
  .status { text-align: center; padding: 1.5rem 1.2rem; }
  .status .num { color: var(--muted); font-size: .85rem; }
  .status .eq { font-size: 1.15rem; font-weight: 600; margin: .2rem 0 1rem; }
  .status .big { font-size: 1.5rem; font-weight: 700; margin: .5rem 0 .3rem; }
  .status .msg { color: var(--ink2); }
  .stepper { overflow: visible; }
  .stepper .step { min-width: 0; font-size: .68rem; padding-left: 2px; padding-right: 2px; }
  @media (max-width: 480px) { .stepper .step { font-size: 0; padding-top: 14px; } }
  .card + .card { margin-top: .8rem; }
  footer { text-align: center; color: #6b7280; font-size: .8rem; padding: 1rem; }
  .big-green { color: var(--ok); } .big-amber { color: var(--warn); } .big-blue { color: var(--accent); } .big-violet { color: #6b3fc4; } .big-red { color: var(--bad); } .big-gray { color: var(--ink2); }
</style>
</head>
<body>
<div class="hero"><img src="img/logo.png" alt="GScom"><p>Seguimiento de tu equipo</p></div>
<div class="wrap" id="app"><div class="card card-pad empty">Cargando…</div></div>
<footer>GScom · Service técnico</footer>
<script type="module" src="js/seguimiento.js"></script>
</body>
</html>
